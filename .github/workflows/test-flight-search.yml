                              entry["stderr"] = result.stderr[-4000:]

                              if result.returncode == 0:
                                  try:
                                      response = json.loads(result.stdout)
                                      entry["response"] = response
                                      if response.get("success"):
                                          for flight in response.get("flights", []) or []:
                                              key = itinerary_key(entry, flight)
                                              if key not in unique_flights:
                                                  unique_flights[key] = {
                                                      "search": {
                                                          "origin": entry["origin"],
                                                          "destination": entry["destination"],
                                                          "departure": entry["departure"],
                                                          "return": entry["return"],
                                                          "trip_days": entry["trip_days"],
                                                          "stops_filter": entry["stops_filter"],
                                                      },
                                                      "flight": flight,
                                                      "observed_in_searches": [stops],
                                                  }
                                              else:
                                                  observed = unique_flights[key]["observed_in_searches"]
                                                  if stops not in observed:
                                                      observed.append(stops)
                                  except json.JSONDecodeError:
                                      entry["error"] = "Command succeeded but output was not valid JSON"
                                      entry["stdout_excerpt"] = result.stdout[:4000]
                              else:
                                  # Preserve stdout too: some CLI errors are written there.
                                  entry["stdout_excerpt"] = result.stdout[-4000:]
                                  entry["error"] = "FLI command returned a non-zero exit code"

                          except subprocess.TimeoutExpired as exc:
                              entry["error"] = "Search timed out after 90 seconds"
                              entry["stdout_excerpt"] = (exc.stdout or "")[-4000:] if isinstance(exc.stdout, str) else ""
                              entry["stderr"] = (exc.stderr or "")[-4000:] if isinstance(exc.stderr, str) else ""

                          searches.append(entry)
                          raw_path.write_text(json.dumps(searches, indent=2), encoding="utf-8")
                          time.sleep(1)

          clean_results = sorted(
              unique_flights.values(),
              key=lambda item: (
                  item["search"]["destination"],
                  item["search"]["departure"],
                  item["flight"].get("price", float("inf")),
              ),
          )
          clean_path.write_text(json.dumps(clean_results, indent=2), encoding="utf-8")

          fields = [
              "origin", "destination", "departure", "return", "trip_days",
              "price", "currency", "total_duration_minutes", "stops",
              "outbound_legs", "return_legs", "outbound_airlines",
              "return_airlines", "self_transfer", "mixed_cabin", "booking_token",
              "observed_in_stop_filters",
          ]
          with csv_path.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for item in clean_results:
                  search = item["search"]
                  flight = item["flight"]
                  outbound = leg_summary(flight.get("outbound"))
                  inbound = leg_summary(flight.get("return"))
                  writer.writerow({
                      "origin": search["origin"],
                      "destination": search["destination"],
                      "departure": search["departure"],
                      "return": search["return"],
                      "trip_days": search["trip_days"],
                      "price": flight.get("price"),
                      "currency": flight.get("currency"),
                      "total_duration_minutes": flight.get("duration"),
                      "stops": flight.get("stops"),
                      "outbound_legs": json.dumps(outbound, ensure_ascii=False),
                      "return_legs": json.dumps(inbound, ensure_ascii=False),
                      "outbound_airlines": ", ".join(dict.fromkeys(x["airline"] or "" for x in outbound)),
                      "return_airlines": ", ".join(dict.fromkeys(x["airline"] or "" for x in inbound)),
                      "self_transfer": (flight.get("outbound") or {}).get("self_transfer"),
                      "mixed_cabin": (flight.get("outbound") or {}).get("mixed_cabin"),
                      "booking_token": flight.get("outbound", {}).get("booking_token", ""),
                      "observed_in_stop_filters": ",".join(item["observed_in_searches"]),
                  })

          successful = sum(1 for item in searches if item.get("exit_code") == 0 and item.get("response", {}).get("success"))
          failed = len(searches) - successful
          raw_flight_count = sum(
              len(item.get("response", {}).get("flights", []) or [])
              for item in searches
              if item.get("response", {}).get("success")
          )
          print(f"Completed searches: {len(searches)}")
          print(f"Successful searches: {successful}")
          print(f"Failed searches: {failed}")
          print(f"Raw flight rows: {raw_flight_count}")
          print(f"Deduplicated itinerary/fare rows: {len(clean_results)}")
          print(f"Saved {raw_path}, {clean_path}, and {csv_path}")
          PY

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-search-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
