name: Test Flight Search

on:
workflow_dispatch:

permissions:
contents: read

jobs:
test-search:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install FLI
    run: python -m pip install flights

  - name: Search Hyderabad to Delhi
    run: |
      DEPARTURE=$(date -u -d "+45 days" +%Y-%m-%d)
      RETURN=$(date -u -d "+52 days" +%Y-%m-%d)

      echo "Departure date: $DEPARTURE"
      echo "Return date: $RETURN"

      fli flights HYD DEL "$DEPARTURE" \
        --return "$RETURN" \
        --passengers 2 \
        --class ECONOMY \
        --stops NON_STOP \
        --currency INR \
        --country IN \
        --language en-IN \
        --format json
