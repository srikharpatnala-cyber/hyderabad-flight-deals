name: Test Flight Search

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir click
          python -m pip install --no-cache-dir flights

      - name: Diagnose FLI CLI
        run: |
          python -m pip show flights
          fli --help
          fli flights --help
